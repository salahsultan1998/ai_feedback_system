{% extends "base.html" %}
{% block content %}
<header class="home-heading">
    <img src="{{ icon_url('app-icon.svg') }}" alt="" aria-hidden="true">
    <h1 class="title">AI 反馈统计</h1>
</header>
<main class="container">
    {% for game in games %}
    <a class="card" href="{{ url_for('pages.game', code=game.code) }}" aria-label="{{ game.name }} 反馈报告">
        <div class="card-icon"><img src="{{ icon_url(game.image) }}" alt=""></div>
        <h2>{{ game.name }}</h2>
    </a>
    {% endfor %}
</main>
{% endblock %}
