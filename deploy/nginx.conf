# Add as a separate site; keep your translation app's existing site unchanged.
# Replace the domain and certificate paths before running nginx -t.
server {
    listen 80;
    server_name feedback.example.com;
    return 301 https://feedback.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name feedback.example.com;
    ssl_certificate /etc/ssl/ai-feedback/fullchain.pem;
    ssl_certificate_key /etc/ssl/ai-feedback/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match max_upload_mb in config/settings.json (whole request, including form data).
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers: the app trusts one proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Upload validation and Feishu pushes run inside an HTTP request.
        proxy_read_timeout 300s;
    }
}
